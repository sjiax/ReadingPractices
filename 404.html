<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 英语阅读精读</title>
<style>
  :root {
    --navy: #123c60; --muted: #4f5b68; --line: #d9dee6;
    --f-en: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --f-zh: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --f-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #fff; color: #15191f;
    font-family: var(--f-en); font-size: 20px; line-height: 1.7;
  }
  .box { max-width: 560px; text-align: center; }
  .code { font-family: var(--f-ui); font-size: 15px; letter-spacing: .18em; color: #8a5600; text-transform: uppercase; }
  h1 { margin: 10px 0 8px; font-size: clamp(30px, 5vw, 42px); line-height: 1.2; color: #0d1219; }
  p { margin: 0 0 22px; font-family: var(--f-zh); color: var(--muted); }
  a {
    display: inline-block; padding: 10px 20px; border-radius: 10px;
    background: var(--navy); color: #fff; text-decoration: none;
    font-family: var(--f-ui); font-size: 15px; font-weight: 600;
  }
  a:hover { filter: brightness(1.15); }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404 · Not Found</p>
    <h1>这一页不在了</h1>
    <p>地址可能拼错了，或者这篇练习还没上传。</p>
    <a href="/">回到目录</a>
  </div>
</body>
</html>
